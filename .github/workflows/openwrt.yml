name: OpenWrt plugin

on:
  pull_request:
    paths:
      [
        'openwrt/**',
        'tests/openwrt/**',
        'apps/web/src/utils/endpoint*',
        'apps/web/src/constants/default.ts',
        '.github/workflows/openwrt.yml',
      ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (X.Y.Z), must match source'
        default: '0.6.33'
        required: true
      publish:
        description: 'After all checks, upload to a release draft (main only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Check release version and publishing branch before building
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python3 scripts/publish-openwrt.py check-version "$VERSION"
          if [ "$PUBLISH" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Release drafts can only be uploaded from main' >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Shell, UI and isolated OpenWrt tests
        run: |
          python3 -m unittest discover -s tests/repository -v
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -s sh -e SC1091 openwrt/install.sh openwrt/files/nailink openwrt/files/daed-check openwrt/files/rpcd-daed openwrt/files/subscription-proxy openwrt/subscription-check.sh openwrt/network-check.sh
          shellcheck -s sh -e SC1091,SC2034,SC3043 openwrt/files/daed.init openwrt/files/maintenance.init
          node --test tests/openwrt/ui.test.cjs
          curl -fL --proto '=https' -o /tmp/daed-rootfs.tar.gz https://downloads.openwrt.org/releases/24.10.4/targets/x86/64/openwrt-24.10.4-x86-64-rootfs.tar.gz
          echo 'e7f8ab84eef55c7eb23492de7b0517dbc23fbedaa4abbb680fe64720c309dc03  /tmp/daed-rootfs.tar.gz' | sha256sum -c -
          mkdir /tmp/daed-rootfs
          sudo tar -xzf /tmp/daed-rootfs.tar.gz -C /tmp/daed-rootfs
          sudo env DAED_TEST_ROOTFS=/tmp/daed-rootfs python3 -m unittest discover -s tests/openwrt -v

  web:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --dir apps/web build:openwrt
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web check-types
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: openwrt-web
          path: apps/web/dist-openwrt/

  runtime:
    if: github.event_name == 'workflow_dispatch'
    needs: web
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        cpu: [x86_64, arm64, armv7, mips, mipsle]
    env:
      GOOS: linux
      CGO_ENABLED: '0'
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache-dependency-path: wing/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: openwrt-web
          path: dist/
      - name: Build real eBPF and bundled runtime
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm zstd
          mkdir -p .build/runtime
          python3 openwrt/runtime.py --cpu '${{ matrix.cpu }}' --wing wing --web dist --version "$VERSION" --work /tmp/daed-runtime-sdk --output .build/runtime
      - name: BTF parser tests
        if: matrix.cpu == 'x86_64'
        run: cd wing && go test ../openwrt/btf-probe.go ../openwrt/btf-probe_test.go
      - name: Foreign architecture SQLite and API smoke test
        if: matrix.cpu == 'armv7' || matrix.cpu == 'mips' || matrix.cpu == 'mipsle'
        run: |
          sudo apt-get install -y --no-install-recommends qemu-user-static
          python3 tests/openwrt/architecture_smoke.py --cpu '${{ matrix.cpu }}' --binary .build/runtime/daed
          python3 tests/openwrt/architecture_regression.py --cpu '${{ matrix.cpu }}' --wing wing
      - name: Live TCP and UDP runtime overview regression
        if: matrix.cpu == 'x86_64'
        run: |
          (cd wing && go test -count=1 -v -tags daed_runtime_test ./cmd ./dae ./graphql/service/general)
          (cd wing/dae-core && go test -count=1 ./control -run 'Runtime|RelayTCP|Tracked|ActiveTCP')
          (cd wing/dae-core && go test -count=1 ./control -run '^TestRouterDNS|^TestRouterConnection|^TestRouteDial|^TestDnsForwarder')
      - name: Transaction, node cancellation, subscription cron and failure preservation tests
        if: matrix.cpu == 'x86_64'
        run: cd wing && go test -count=1 -v ./graphql ./graphql/service/node ./graphql/service/subscription ./webrender
      - name: Backend concurrency regression
        if: matrix.cpu == 'x86_64'
        run: |
          cd wing
          CGO_ENABLED=1 go test -race -count=1 ./graphql ./graphql/service/node ./graphql/service/subscription ./cmd ./dae ./webrender
          CGO_ENABLED=1 go test -race -count=1 github.com/daeuniverse/dae/component -run '^TestRouterInterface'
          CGO_ENABLED=1 go test -race -count=1 github.com/daeuniverse/dae/control -run '^TestRouterDNS|^TestRouterConnection|^TestRouteDial|^TestDnsForwarder'
          CGO_ENABLED=1 go test -race -count=1 github.com/daeuniverse/dae/component/outbound/dialer -run '^TestRouter(ProtocolURIOptions|SSClose)'
      - name: Independent protocol HTTP and UDP regression
        if: matrix.cpu == 'x86_64'
        run: |
          mkdir -p /tmp/nailink-protocol-servers
          curl -fL --proto '=https' -o /tmp/nailink-protocol-servers/sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz
          echo 'e2bdf179c15a3652955dc44867e33ca0965c9c9b91b34267dcc5a5d639a5feee  /tmp/nailink-protocol-servers/sing-box.tar.gz' | sha256sum -c -
          tar -xzf /tmp/nailink-protocol-servers/sing-box.tar.gz -C /tmp/nailink-protocol-servers
          curl -fL --proto '=https' -o /tmp/nailink-protocol-servers/juicity.zip https://github.com/juicity/juicity/releases/download/v0.5.0/juicity-linux-x86_64.zip
          echo 'c0c11e8691e6a16b42de7c7a02d83a616fef79e574a88cc3765045c0b91b1e66  /tmp/nailink-protocol-servers/juicity.zip' | sha256sum -c -
          python3 -m zipfile -e /tmp/nailink-protocol-servers/juicity.zip /tmp/nailink-protocol-servers/juicity
          chmod +x /tmp/nailink-protocol-servers/juicity/juicity-server
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" python3 tests/openwrt/protocol_interop.py --wing wing --sing-box /tmp/nailink-protocol-servers/sing-box-1.14.3-linux-amd64/sing-box --juicity-server /tmp/nailink-protocol-servers/juicity/juicity-server
      - name: LuCI gateway authentication and upgrade tests
        if: matrix.cpu == 'x86_64'
        run: |
          (cd wing && go test ../openwrt/luci-proxy.go ../openwrt/luci-proxy_test.go ../openwrt/maintenance.go ../openwrt/maintenance-geodata.go ../openwrt/maintenance_test.go)
          curl -fL --proto '=https' -o /tmp/luci-rootfs-25.tar.gz https://downloads.openwrt.org/releases/25.12.4/targets/x86/64/openwrt-25.12.4-x86-64-rootfs.tar.gz
          echo '0b80f307a5383a0c2c08712c500a4351f7b7cad0a6c2963e02a74db4e6831bf4  /tmp/luci-rootfs-25.tar.gz' | sha256sum -c -
          mkdir /tmp/luci-rootfs-25
          sudo tar -xzf /tmp/luci-rootfs-25.tar.gz -C /tmp/luci-rootfs-25
          sudo env DAED_TEST_ROOTFS=/tmp/luci-rootfs-25 DAED_TEST_LUCI_PROXY="$PWD/.build/runtime/luci-proxy" python3 -m unittest discover -s tests/openwrt -p test_luci_session.py -v
      - name: Build test-only geodata finder and routing parser
        if: matrix.cpu == 'x86_64'
        run: cd wing && go build -trimpath -o "$GITHUB_WORKSPACE/.build/runtime/geodata-probe" "$GITHUB_WORKSPACE/tests/openwrt/geodata-probe.go"
      - name: amd64 startup smoke test (API only)
        if: matrix.cpu == 'x86_64'
        run: |
          .build/runtime/daed --version
          mkdir -p /tmp/daed-api
          .build/runtime/daed run --api-only --config /tmp/daed-api --listen 127.0.0.1:12023 > /tmp/daed-api.log 2>&1 &
          daemon=$!
          trap 'kill "$daemon" 2>/dev/null || true; wait "$daemon" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -f http://127.0.0.1:12023/ -o /tmp/daed-index.html; then break; fi
            sleep 1
          done
          grep -q '<html' /tmp/daed-index.html
      - name: Preserve corresponding source
        if: matrix.cpu == 'x86_64'
        run: |
          git submodule status --recursive > .build/runtime/SOURCE_SUBMODULES.txt
          git rev-parse HEAD > .build/runtime/SOURCE_COMMIT.txt
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.build --exclude=.turbo -czf .build/runtime/daed-openwrt-source.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: openwrt-runtime-${{ matrix.cpu }}
          path: .build/runtime/

  packages:
    needs: runtime
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ipk-x86_64
            cpu: x86_64
          - target: ipk-arm64
            cpu: arm64
          - target: apk-x86_64
            cpu: x86_64
          - target: apk-arm64
            cpu: arm64
          - target: ipk-armv7
            cpu: armv7
          - target: apk-armv7
            cpu: armv7
          - target: ipk-mips
            cpu: mips
          - target: apk-mips
            cpu: mips
          - target: ipk-mipsle
            cpu: mipsle
          - target: apk-mipsle
            cpu: mipsle
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: openwrt-runtime-${{ matrix.cpu }}
          path: .build/runtime/
      - name: Build native packages with pinned SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gawk gettext libncurses-dev libssl-dev python3 rsync unzip zstd
          python3 openwrt/build.py --target '${{ matrix.target }}' --binary .build/runtime/daed --btf-probe .build/runtime/btf-probe --luci-proxy .build/runtime/luci-proxy --version "$VERSION" --work /tmp/daed-sdk --output .build/packages
      - name: Real APK architecture, preflight and uninstall tests
        if: matrix.target == 'apk-x86_64'
        run: |
          curl -fL --proto '=https' -o /tmp/daed-rootfs.tar.gz https://downloads.openwrt.org/releases/24.10.4/targets/x86/64/openwrt-24.10.4-x86-64-rootfs.tar.gz
          echo 'e7f8ab84eef55c7eb23492de7b0517dbc23fbedaa4abbb680fe64720c309dc03  /tmp/daed-rootfs.tar.gz' | sha256sum -c -
          mkdir /tmp/daed-rootfs
          sudo tar -xzf /tmp/daed-rootfs.tar.gz -C /tmp/daed-rootfs
          sudo env DAED_TEST_ROOTFS=/tmp/daed-rootfs DAED_TEST_APK=/tmp/daed-sdk/apk-x86_64/staging_dir/host/bin/apk DAED_TEST_LUCI_PROXY="$PWD/.build/runtime/luci-proxy" DAED_TEST_GEODATA_PROBE="$PWD/.build/runtime/geodata-probe" python3 -m unittest discover -s tests/openwrt -v
      - uses: actions/upload-artifact@v7
        with:
          name: openwrt-packages-${{ matrix.target }}
          path: .build/packages/

  kernel-preflight:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - cpu: x86_64
            goarch: amd64
            qemu_package: qemu-system-x86
            qemu: qemu-system-x86_64
            expect: success
          - cpu: armv7
            goarch: arm
            qemu_package: qemu-system-arm
            qemu: qemu-system-arm
            expect: failure
          - cpu: mips
            goarch: mips
            qemu_package: qemu-system-mips
            qemu: qemu-system-mips
            expect: failure
          - cpu: mipsle
            goarch: mipsle
            qemu_package: qemu-system-mips
            qemu: qemu-system-mipsel
            expect: failure
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache-dependency-path: wing/go.sum
      - name: Build standalone probes and fetch checksum-pinned test kernel
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: 7,softfloat
          GOMIPS: softfloat
        run: |
          mkdir -p .build/kernel-vm
          (cd wing && go build -o ../.build/kernel-vm/init ../tests/openwrt/kernel_probe_init.go)
          (cd wing && go build -o ../.build/kernel-vm/probe ../openwrt/btf-probe.go)
          python3 -c 'import hashlib,json,urllib.request; r=json.load(open("tests/openwrt/kernel-vm-matrix.json"))["${{ matrix.cpu }}"]; p=".build/kernel-vm/kernel"; urllib.request.urlretrieve(r["url"],p); assert hashlib.sha256(open(p,"rb").read()).hexdigest()==r["sha256"]'
      - name: Verify real kernel acceptance or expected incompatibility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends '${{ matrix.qemu_package }}' e2fsprogs
          sudo python3 tests/openwrt/kernel_probe_vm.py --cpu '${{ matrix.cpu }}' --kernel .build/kernel-vm/kernel --init .build/kernel-vm/init --probe .build/kernel-vm/probe --qemu '/usr/bin/${{ matrix.qemu }}' --work .build/kernel-vm --expect '${{ matrix.expect }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kernel-preflight-${{ matrix.cpu }}
          path: .build/kernel-vm/*.log

  assemble:
    needs: [packages, kernel-preflight]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: openwrt-packages-*
          merge-multiple: true
          path: .build/release/
      - uses: actions/download-artifact@v8
        with:
          name: openwrt-runtime-x86_64
          path: .build/source/
      - run: |
          cp .build/source/daed-openwrt-source.tar.gz .build/source/SOURCE_*.txt .build/release/
          cp openwrt/README.md openwrt/VALIDATION.md .build/release/
          python3 openwrt/manifest.py .build/release --version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: daed-openwrt-${{ inputs.version }}
          path: .build/release/

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: daed-openwrt-${{ inputs.version }}
          path: .build/release/
      - name: Verify checksums, matching source and immutable release before upload
        run: python3 scripts/publish-openwrt.py publish .build/release --version "$VERSION" --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
